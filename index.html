<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Data Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div id="header-container"></div>
    </header>
    <main class="dashboard-container">

        <section id="left-sidebar"></section>

        <section id="left-column">
            <div id="network-graph-container" class="chart-container">
                <h2 id="network-title">Actor–Type Network</h2>
            </div>
        </section>

        <section id="middle-column">
            <div class="chart-container">
                <div id="dropdown-container"></div>
            </div>
            <div id="sunburst-container" class="chart-container">
                <h2 id="sunburst-title">Hierarchical Explorer</h2>
            </div>
        </section>

        <section id="right-column">
            <div id="heatmap-container" class="chart-container">
                <h2 id="heatmap-title">Title Ratings per Type</h2>
            </div>
            <div id="correlation-plot-container" class="chart-container">
                <h2 id="correlation-title">Rating vs Type</h2>
                <svg id="correlation-chart-svg"></svg>
            </div>
        </section>

    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
